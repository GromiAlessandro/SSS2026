<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Esercitazione Docker</title>
</head>
<body>
    <h1>Il mio primo sito con Docker</h1>
    <p>Pagina servita da Nginx dentro un container.</p>

    <h2>Presentati!</h2>

    <form id="presentazione">
        <label for="nome">Nome:</label>
        <input id="nome" type="text" required>
        <br><br>

        <label for="email">Email:</label>
        <input id="email" type="email" required>
        <br><br>

        <button type="submit">Invia</button>
    </form>

    <p id="messaggio" role="status"></p>

    <script>
        const form = document.getElementById("presentazione");

        form.addEventListener("submit", function (evento) {
            evento.preventDefault();

            const nome = document.getElementById("nome").value;
            const email = document.getElementById("email").value;

            document.getElementById("messaggio").textContent =
                "Ciao " + nome + "! Hai inserito l'email: " + email;
        });
    </script>
</body>
</html>
